<!-- Albumix logo variant 3 — Shield badge with foil-gold ring and "Ax" monogram center -->
<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Albumix logo variant 3">
  <defs>
    <linearGradient id="v3Ring" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.3" stop-color="#F4C84A"/>
      <stop offset="0.6" stop-color="#C2913A"/>
      <stop offset="0.85" stop-color="#F4C84A"/>
      <stop offset="1" stop-color="#FFE9A8"/>
    </linearGradient>
    <linearGradient id="v3Text" x1="36" y1="34" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.4" stop-color="#F4C84A"/>
      <stop offset="0.7" stop-color="#C2913A"/>
      <stop offset="1" stop-color="#FFE9A8"/>
    </linearGradient>
    <radialGradient id="v3Glow" cx="60" cy="60" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D1A26"/>
      <stop offset="1" stop-color="#0D0F13"/>
    </radialGradient>
  </defs>

  <!-- Outer foil ring -->
  <circle cx="60" cy="60" r="54" fill="url(#v3Ring)"/>

  <!-- Inner dark circle -->
  <circle cx="60" cy="60" r="48" fill="url(#v3Glow)"/>

  <!-- Thin inner accent ring -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="rgba(244,200,74,0.25)" stroke-width="1"/>

  <!-- "A" letterform — left leg -->
  <polygon points="36,86 49,34 54,34 44,86" fill="url(#v3Text)"/>
  <!-- "A" right leg -->
  <polygon points="84,86 70,34 75,34 63,86" fill="url(#v3Text)"/>
  <!-- "A" cap bridge -->
  <polygon points="49,34 75,34 72,46 52,46" fill="url(#v3Text)"/>
  <!-- "A" crossbar -->
  <rect x="38" y="60" width="44" height="8" rx="1.5" fill="url(#v3Text)"/>
  <!-- "A" interior cutouts -->
  <polygon points="52,59 72,59 66,46 58,46" fill="#0D0F13"/>
  <polygon points="41,86 52,59 56,59 44,86" fill="#0D0F13"/>
  <polygon points="79,86 68,59 64,59 76,86" fill="#0D0F13"/>

  <!-- "x" subscript — small, bottom-right of the A -->
  <line x1="70" y1="76" x2="82" y2="88" stroke="url(#v3Text)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="82" y1="76" x2="70" y2="88" stroke="url(#v3Text)" stroke-width="3.5" stroke-linecap="round"/>
</svg>
