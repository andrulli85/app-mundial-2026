<!-- Albumix logo variant 4 — Sticker corner peel with checkmark, tactile collectible feel -->
<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Albumix logo variant 4">
  <defs>
    <linearGradient id="v4Foil" x1="0" y1="120" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.3" stop-color="#F4C84A"/>
      <stop offset="0.6" stop-color="#C2913A"/>
      <stop offset="0.85" stop-color="#F4C84A"/>
      <stop offset="1" stop-color="#FFE9A8"/>
    </linearGradient>
    <linearGradient id="v4StickerFace" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4C84A"/>
      <stop offset="0.5" stop-color="#C2913A"/>
      <stop offset="1" stop-color="#A07020"/>
    </linearGradient>
    <linearGradient id="v4PeelShadow" x1="74" y1="74" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D0F13" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0D0F13" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="v4PeelBack" x1="74" y1="74" x2="114" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.5" stop-color="#E8C060"/>
      <stop offset="1" stop-color="#B07828"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded-square background -->
  <rect width="120" height="120" rx="22" fill="#0D0F13"/>
  <rect width="120" height="120" rx="22" fill="none" stroke="rgba(244,200,74,0.35)" stroke-width="1.5"/>

  <!-- Sticker main body — large foil-gold rectangle occupying most of viewBox -->
  <!-- Clipped to simulate bottom-left peeling corner -->
  <!-- Sticker face: top-left of the card area -->
  <polygon
    points="10,10 104,10 104,74 74,104 10,104"
    fill="url(#v4StickerFace)"
  />

  <!-- Sticker edge highlight — top and left rim -->
  <polyline
    points="10,104 10,10 104,10"
    fill="none"
    stroke="rgba(255,233,168,0.7)"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Shadow cast by the peel -->
  <polygon
    points="74,104 104,74 114,114"
    fill="url(#v4PeelShadow)"
  />

  <!-- Peel back — the curled corner, lighter foil underside -->
  <polygon
    points="74,104 104,74 110,110"
    fill="url(#v4PeelBack)"
  />

  <!-- Peel crease line -->
  <line x1="74" y1="104" x2="104" y2="74" stroke="rgba(244,200,74,0.6)" stroke-width="1.2"/>

  <!-- Checkmark — centered in the sticker face area -->
  <!-- Thick dark check on gold: left stroke then right stroke -->
  <polyline
    points="32,58 48,76 88,36"
    fill="none"
    stroke="#0D0F13"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Inner check highlight — slightly thinner, offset up-left for depth -->
  <polyline
    points="32,56 48,74 88,34"
    fill="none"
    stroke="rgba(255,255,255,0.22)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
