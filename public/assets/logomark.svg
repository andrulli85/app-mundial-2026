<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30" fill="none">
  <!-- Ball silhouette — simplified FIFA-style football -->
  <circle cx="15" cy="15" r="14" fill="#1a1a1a" stroke="#F4C84A" stroke-width="1.5"/>
  <!-- Central pentagon -->
  <polygon points="15,7 20.5,11.5 18.5,18 11.5,18 9.5,11.5" fill="#F4C84A" opacity="0.9"/>
  <!-- Stitching lines -->
  <line x1="15" y1="7" x2="15" y2="2" stroke="#F4C84A" stroke-width="1.2" opacity="0.6"/>
  <line x1="20.5" y1="11.5" x2="25" y2="9" stroke="#F4C84A" stroke-width="1.2" opacity="0.6"/>
  <line x1="18.5" y1="18" x2="22" y2="22" stroke="#F4C84A" stroke-width="1.2" opacity="0.6"/>
  <line x1="11.5" y1="18" x2="8" y2="22" stroke="#F4C84A" stroke-width="1.2" opacity="0.6"/>
  <line x1="9.5" y1="11.5" x2="5" y2="9" stroke="#F4C84A" stroke-width="1.2" opacity="0.6"/>
</svg>
