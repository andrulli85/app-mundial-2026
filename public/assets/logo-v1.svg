<!-- Albumix logo variant 1 — Bold geometric "A" monogram with foil-gold gradient fill -->
<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Albumix logo variant 1">
  <defs>
    <linearGradient id="v1Foil" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.35" stop-color="#F4C84A"/>
      <stop offset="0.65" stop-color="#C2913A"/>
      <stop offset="1" stop-color="#FFE9A8"/>
    </linearGradient>
    <linearGradient id="v1Stripe" x1="28" y1="60" x2="92" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#F4C84A"/>
      <stop offset="1" stop-color="#C2913A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded-square background -->
  <rect width="120" height="120" rx="22" fill="#0D0F13"/>
  <rect width="120" height="120" rx="22" fill="none" stroke="rgba(244,200,74,0.35)" stroke-width="1.5"/>

  <!-- Geometric "A" letterform — bold sans-serif construction -->
  <!-- Left leg -->
  <polygon points="14,96 38,24 46,24 26,96" fill="url(#v1Foil)"/>
  <!-- Right leg -->
  <polygon points="94,96 74,24 82,24 106,96" fill="url(#v1Foil)"/>
  <!-- Cap triangle filler between legs at top -->
  <polygon points="38,24 82,24 76,40 44,40" fill="url(#v1Foil)"/>

  <!-- Crossbar — styled horizontal stripe (card/pack-opening echo) -->
  <rect x="29" y="58" width="62" height="11" rx="2" fill="url(#v1Stripe)"/>
  <!-- Cutout inside legs above crossbar to give clean A shape -->
  <polygon points="44,57 76,57 68,40 52,40" fill="#0D0F13"/>
  <!-- Cutout inside legs below crossbar -->
  <polygon points="32,96 44,57 50,57 36,96" fill="#0D0F13"/>
  <polygon points="88,96 76,57 70,57 84,96" fill="#0D0F13"/>
</svg>
